[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fundready-backend"
version = "0.1.0"
description = "FundReady - AI business audit and investor-matching backend for SACI Holdings."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    # Config & validation
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Database & migrations (Neon: Postgres + pgvector)
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    # Auth: we issue and verify our own tokens (AUTH.md, DECISIONS.md D17).
    # `boto3` (Cloudflare R2, S3-compatible) lands with T1.5.
    "pyjwt[crypto]>=2.9",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    # Background jobs
    "redis>=5.2",
    "rq>=2.0",
    # External services
    "anthropic>=0.40",
    "stripe>=11.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# ruff - lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # import sorting
    "N",     # pep8 naming
    "UP",    # pyupgrade
    "B",     # bugbear
    "S",     # flake8-bandit (security)
    "ASYNC", # async correctness
    "C4",    # comprehensions
    "SIM",   # simplify
    "RET",   # return consistency
    "PTH",   # prefer pathlib
    "ARG",   # unused arguments
    "T20",   # no print/pprint - stray prints are how secrets reach logs
    "TID",   # tidy imports
]

[tool.ruff.lint.per-file-ignores]
# Tests may assert, use hardcoded credentials in fixtures, and bind all interfaces.
"tests/**" = ["S101", "S105", "S106", "S104", "ARG"]

[tool.ruff.lint.flake8-tidy-imports]
# Modules talk to each other through public service functions only
# (ARCHITECTURE.md section 3); relative imports across modules hide that.
ban-relative-imports = "all"

# ---------------------------------------------------------------------------
# mypy - strict on application code
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["app"]
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Relaxed for tests: fixtures and monkeypatching fight strict typing for
# little benefit. Application code stays strict.
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# Third-party packages that ship no type information. Listed explicitly -
# never blanket-ignore missing imports.
module = ["rq.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
asyncio_mode = "auto"
markers = [
    "security: authorization, tenant isolation, report-tier, gating, webhooks",
    "integration: exercises the database, queue, or an external adapter",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
