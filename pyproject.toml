[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fundready-backend"
version = "0.1.0"
description = "FundReady - AI business audit and investor-matching backend for SACI Holdings."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    # Config & validation
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Database & migrations
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    # Auth (Supabase JWT verification)
    "pyjwt[crypto]>=2.9",
    # Background jobs
    "redis>=5.2",
    "rq>=2.0",
    # External services
    "anthropic>=0.40",
    "stripe>=11.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
include = ["app*"]
