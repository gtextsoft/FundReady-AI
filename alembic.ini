# Alembic configuration.
#
# The database URL is deliberately NOT set here. This file is committed, and the
# connection string carries credentials -- `migrations/env.py` reads it from the
# environment through `app.core.config` instead (CLAUDE.md section 4).

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# Timestamped, readable filenames: 2026_07_29_0930-abc123_add_users_table.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone = UTC

# Logging for the `alembic` CLI only. This is a separate process from the API,
# so it does not interfere with the application's JSON logging; without it,
# `alembic upgrade head` runs completely silently and you cannot tell what it
# did. Note that Alembic never logs the URL, only revision transitions.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
