name: CI

# Every push and pull request runs lint, type-check, tests, and a secret scan
# (AGENTS.md section 1, CLAUDE.md section 7). Nothing merges red.
#
# This file must live at the *repository* root. GitHub Actions only discovers
# workflows in `/.github/workflows`, so while it sat under `backend/` it was
# never run at all. The repository is a monorepo (`backend/`, `frontend/`,
# `skills/`), hence the `working-directory` below: the quality job is the
# backend's, and every one of its commands expects `backend/` as the cwd.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # `cache-dependency-path` is an action input, not a `run:` command, so
      # `working-directory` does not apply to it -- it stays root-relative.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt

      # `-c constraints.txt` is the same pin set render.yaml builds against, so
      # a green run here and a working deploy mean the same thing. Without it
      # the two install from floors (`>=`) on different days and can differ.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt

      - name: Lint
        run: ruff check --output-format=github .

      - name: Format
        run: ruff format --check .

      - name: Type-check
        run: mypy app

      - name: Tests
        run: pytest

  frontend:
    name: Frontend lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          # Root-relative for the same reason as the Python job above: this is
          # an action input, so `working-directory` does not reach it.
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` deliberately, not `npm install`: it installs the lockfile
      # exactly and fails if `package.json` and the lock have drifted. It also
      # runs without `--legacy-peer-deps`, which is why `jest-expo` is not a
      # dependency here -- see the note in `frontend/jest.config.js`.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Tests
        run: npm test

      # NOT a gate yet, deliberately. The app predates Prettier by ~80 files,
      # so `--check` fails everywhere and a repo-wide reformat would bury real
      # changes in whitespace. Run `npm run format:write` to take that diff in
      # one commit, then promote this to a required step.
      - name: Format (advisory)
        run: npm run format || true
        continue-on-error: true

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: a secret committed once stays a leak

      # The gitleaks binary is used directly rather than the marketplace action,
      # which requires a paid licence key for organisation-owned repositories.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      # NOTE: `detect` is deprecated in favour of `gitleaks git` from 8.19
      # onward; switch when the pinned version is next bumped.
      - name: Scan history for secrets
        run: gitleaks detect --source . --redact --no-banner --exit-code 1

  # Render autoDeploy is off (see render.yaml). A green main branch deploys by
  # hitting the deploy hooks so a red CI never reaches production.
  deploy:
    name: Deploy to Render (main)
    needs: [quality, frontend, secret-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render web deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_API not set; skipping web deploy"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"

      - name: Trigger Render worker deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WORKER }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_WORKER not set; skipping worker deploy"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
