# FundReady on Render -- Blueprint (infrastructure as code).
#
# Two processes, not one. The API answers requests; the worker runs audits. An
# audit is minutes of model time and `CLAUDE.md` section 5 forbids blocking a
# request thread on it, so a deploy without the worker accepts submissions that
# nothing will ever pick up.
#
# Read `backend/docs/DEPLOY.md` before the first deploy. Two things there will
# otherwise cost an afternoon: `APP_ENV=production` refuses to boot until every
# required secret is set (Stripe included, though no Stripe code exists yet),
# and the datastores are deliberately not declared here.
#
# **Neon and Redis are not in this file on purpose.** Postgres is Neon --
# serverless, scales to zero, and already holds the data; re-creating it as a
# Render Postgres would mean a migration nobody asked for. Redis is left as a
# plain connection string so the same blueprint works against Render Key Value
# or Upstash (which `TASKS.md` T5.7 names) without editing services. Both arrive
# as `sync: false` variables below -- Render prompts for them at first deploy.

services:
  - type: web
    name: fundready-api
    runtime: python
    # The repository is a monorepo: `backend/`, `frontend/`, `skills/`. Every
    # command below expects the backend as its working directory.
    rootDir: backend
    plan: starter
    # Closest region to the platform's users (NG, UAE, UK). Both services must
    # agree, and must match the Key Value instance's region if one is used --
    # cross-region Redis is charged and slow.
    region: frankfurt

    # `-c backend/constraints.txt` -- resolved from `rootDir`, so `constraints.txt`
    # -- pins every version to what the suite is green against. Without it a
    # fresh build installs whatever was released this morning, because
    # pyproject.toml declares floors (`>=`). The first thing that would break is
    # `ai/client.py`'s request shape: silently, on the most expensive call the
    # platform makes, with no CI test able to see it. See the file's header.
    buildCommand: pip install --upgrade pip && pip install -e . -c constraints.txt

    # Migrations run here, once, before the new version takes traffic. On the
    # web service only: running it on both would have two processes applying
    # the same migrations concurrently.
    #
    # Alembic prefers `DATABASE_MIGRATION_URL` (Neon's *direct* endpoint) and
    # falls back to `DATABASE_URL`. Set both -- the pooled endpoint is PgBouncer
    # in transaction mode and is not the right target for DDL.
    preDeployCommand: alembic upgrade head

    # `python -m app` rather than bare uvicorn: it pins the event loop psycopg
    # needs and installs the app's own JSON logging. Equivalent to uvicorn on
    # Linux; see `backend/app/__main__.py` for why it exists at all.
    startCommand: python -m app

    # Liveness only. `/v1/health` answers 200 whenever the process is serving
    # and deliberately touches no dependency, so a Neon blip does not read as
    # "this process is dead" and get the service restarted. It follows that a
    # green health check proves the process booted -- **not** that it can reach
    # its database. A readiness probe that checks dependencies is T5.5.
    healthCheckPath: /v1/health

    envVars:
      - fromGroup: fundready-shared
      # Render routes to the container's port; binding loopback would make the
      # service unreachable and show up only as a failing health check.
      - key: HOST
        value: 0.0.0.0

  - type: worker
    name: fundready-worker
    runtime: python
    rootDir: backend
    plan: starter
    region: frankfurt
    buildCommand: pip install --upgrade pip && pip install -e . -c constraints.txt
    # No preDeployCommand: migrations are the web service's job.
    startCommand: python -m app.workers.queue
    envVars:
      - fromGroup: fundready-shared

envVarGroups:
  # One group, both services. The alternative -- declaring these per service --
  # means setting every secret twice, and a JWT signing key that differs between
  # the two is a class of bug that only shows up under load.
  - name: fundready-shared
    envVars:
      # Render's default Python is newer than what CI proves. Pinned to the
      # version `.github/workflows/ci.yml` tests against, so "green in CI" and
      # "runs in production" mean the same thing.
      - key: PYTHON_VERSION
        value: "3.13.5"

      # ---------------------------------------------------------------
      # Application
      # ---------------------------------------------------------------
      #
      # **Staging, not production, for the first deploy.** `APP_ENV=production`
      # turns on `validate_settings`, which refuses to start unless every
      # required secret is present -- including `STRIPE_SECRET_KEY` and
      # `STRIPE_WEBHOOK_SECRET`, which nothing reads until T3.3. Flip this to
      # `production` once they exist; flipping early gets a process that will
      # not boot and an error naming settings rather than the cause.
      - key: APP_ENV
        value: staging
      - key: LOG_LEVEL
        value: INFO
      - key: API_BASE_URL
        sync: false
      # Where emailed links point: the mobile client's deep link, never this
      # API. Mail scanners prefetch URLs and would burn single-use tokens.
      - key: APP_LINK_BASE_URL
        sync: false
      # Empty is correct for a mobile-only client -- no browser origin needs
      # cross-origin access. Set it only when a web console exists.
      - key: CORS_ALLOWED_ORIGINS
        value: ""

      # ---------------------------------------------------------------
      # Database (Neon)
      # ---------------------------------------------------------------
      # DATABASE_URL: the POOLED endpoint (host contains "-pooler").
      # DATABASE_MIGRATION_URL: the DIRECT endpoint (same host, no "-pooler").
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_MIGRATION_URL
        sync: false

      # ---------------------------------------------------------------
      # Authentication
      # ---------------------------------------------------------------
      #
      # **Generate these fresh for this environment; never reuse a development
      # value.** Reusing a development `JWT_SECRET_KEY` means anyone who has
      # ever held the dev `.env` can mint a valid production admin token.
      #
      # Both are arbitrary high-entropy strings -- `token_urlsafe(48)` for each.
      # `MFA_SECRET_ENCRYPTION_KEY` is **not** a pre-formatted Fernet key: it is
      # a passphrase that `core/security.py:_fernet` stretches with HKDF, so an
      # operator never has to know Fernet's key encoding. (An earlier version of
      # this comment said otherwise and would have sent you looking for
      # `Fernet.generate_key()`.)
      #
      # Not `generateValue: true`, because `JWT_SECRET_KEY` has a minimum length
      # the app enforces in production and Render's generator does not guarantee
      # it. Exact commands in `backend/docs/DEPLOY.md` section 2.1.
      #
      # `MFA_SECRET_ENCRYPTION_KEY` cannot be rotated casually: every stored
      # TOTP secret is encrypted under a key derived from it.
      - key: JWT_SECRET_KEY
        sync: false
      - key: MFA_SECRET_ENCRYPTION_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_KEY_ID
        value: k1
      - key: JWT_ISSUER
        value: fundready
      - key: JWT_AUDIENCE
        value: fundready-api
      - key: ACCESS_TOKEN_TTL_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"

      # OWASP floors, enforced in production by `validate_settings`. Memory cost
      # is real RAM per concurrent login: on a Starter instance this is the
      # figure to watch, and the way to lower it is a bigger instance, not a
      # weaker hash.
      - key: ARGON2_MEMORY_COST_KIB
        value: "65536"
      - key: ARGON2_TIME_COST
        value: "3"
      - key: ARGON2_PARALLELISM
        value: "1"

      # ---------------------------------------------------------------
      # Object storage (Cloudflare R2)
      # ---------------------------------------------------------------
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_DOCUMENTS
        sync: false
      - key: R2_BUCKET_EVIDENCE
        sync: false
      - key: STORAGE_SIGNED_URL_TTL_SECONDS
        value: "900"

      # ---------------------------------------------------------------
      # Queue
      # ---------------------------------------------------------------
      # Render Key Value's internal URL, or an Upstash `rediss://` URL. Not
      # declared as a datastore in this file -- see the header.
      - key: REDIS_URL
        sync: false
      - key: QUEUE_NAME
        value: fundready

      # ---------------------------------------------------------------
      # AI
      # ---------------------------------------------------------------
      # The model ids stay blank: the tier choice lives in `app/ai/client.py`
      # next to the tiering logic (D16), and setting them here would smuggle a
      # model decision into configuration.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL_AUDIT
        value: ""
      - key: AI_MODEL_CHAT
        value: ""
      - key: AI_MAX_OUTPUT_TOKENS
        value: ""
      - key: AI_DAILY_BUDGET_TOKENS_PER_USER
        value: ""

      # ---------------------------------------------------------------
      # Stripe (no code reads these until T3.3)
      # ---------------------------------------------------------------
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false

      # ---------------------------------------------------------------
      # Email + monitoring
      # ---------------------------------------------------------------
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      # Optional. Blank means error reporting stays off and failures appear only
      # in Render's log stream -- which is fine until the worker fails an audit
      # at 3am and nobody is reading it.
      - key: SENTRY_DSN
        sync: false
