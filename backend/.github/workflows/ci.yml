name: CI

# Every push and pull request runs lint, type-check, tests, and a secret scan
# (AGENTS.md section 1, CLAUDE.md section 7). Nothing merges red.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Format
        run: ruff format --check .

      - name: Type-check
        run: mypy app

      - name: Tests
        run: pytest

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: a secret committed once stays a leak

      # The gitleaks binary is used directly rather than the marketplace action,
      # which requires a paid licence key for organisation-owned repositories.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      # NOTE: `detect` is deprecated in favour of `gitleaks git` from 8.19
      # onward; switch when the pinned version is next bumped.
      - name: Scan history for secrets
        run: gitleaks detect --source . --redact --no-banner --exit-code 1
